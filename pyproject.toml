[project]
name = "mdtex-cli"
version = "0.1.1"
description = "Render Markdown and LaTeX beautifully in the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "lucaspon" }]
keywords = ["markdown", "latex", "terminal", "cli", "unicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lucaspon/md-cli"
Repository = "https://github.com/lucaspon/md-cli"
Issues = "https://github.com/lucaspon/md-cli/issues"

[project.scripts]
md = "mdtex_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdtex_cli"]
